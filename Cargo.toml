[package]
name = "LogBurst"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
resolver = "3"
members = ["services/*", "crates/config", "crates/error", "crates/domain", "crates/proto", "crates/storage", "crates/service-utils"]

[workspace.dependencies]
config = { path = "crates/config" }
error = { path = "crates/error" }
proto = { path = "crates/proto" }
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
service-utils = { path = "crates/service-utils" }
# rt
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7.14"

# pg
deadpool-postgres = { version = "0.14.1", features = ["rt_tokio_1"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4"] }

# clickhouse
clickhouse = { version = "0.13.2", features = ["inserter", "time"] }

# .env
dotenvy = "0.15.7"
envy = "0.4.2"

# log
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# rest
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
axum = { version = "0.8.3", features = ["macros"] }
anyhow = "1.0.100"
jsonwebtoken = "9.3.1"
validator = { version = "0.20.0", features = ["derive"] }

# time
chrono = { version = "0.4.40", features = [] }
time = { version = "0.3", features = ["serde-human-readable", "macros"] }

# grpc
tonic = "0.13.0"
prost = "0.13.5"
prost-types = "0.13.5"

# crypto
argon2 = { version = "0.6.0-pre.1", features = ["getrandom"] }
blake3 = "1.8.3"
subtle = "2.6.1"

# other
async-channel = "2.5.0"
arc-swap = "1.8.0"
toml = "0.9.11+spec-1.1.0"
futures = "0.3.31"
async-stream = "0.3.6"
rand = "0.10.0"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
tonic-build = "0.13.0"
postcard = { version = "1.1.3", features = ["alloc"] }

[dependencies]
# rt
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7.14"

# pg
deadpool-postgres = { version = "0.14.1", features = ["rt_tokio_1"] }
tokio-postgres = "0.7.13"

# clickhouse
clickhouse = { version = "0.13.2", features = ["inserter", "time"] }

# .env
dotenvy = "0.15.7"
envy = "0.4.2"

# log
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# rest
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
axum = { version = "0.8.3", features = ["macros"] }
anyhow = "1.0.100"
jsonwebtoken = "9.3.1"
validator = { version = "0.20.0", features = ["derive"] }

# time
chrono = { version = "0.4.40", features = [] }
time = { version = "0.3", features = ["serde-human-readable", "macros"] }

# grpc
tonic = "0.13.0"
prost = "0.13.5"
prost-types = "0.13.5"

# crypto
argon2 = { version = "0.6.0-pre.1", features = ["getrandom"] }
blake3 = "1.8.3"
subtle = "2.6.1"

# other
async-channel = "2.5.0"
arc-swap = "1.8.0"
toml = "0.9.11+spec-1.1.0"
futures = "0.3.31"
async-stream = "0.3.6"
rand = "0.10.0"

[build-dependencies]
tonic-build = "0.13.0"
